name: Build Ultra-Optimized Scrcpy APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-optimized:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Cài đặt JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 3. Tối ưu hóa dung lượng, Strip libadb.so và Ký APK
        run: |
          set -e
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          STRIP_TOOL=$(find $ANDROID_HOME/ndk -name "llvm-strip" 2>/dev/null | sort -V | tail -n 1)

          echo "=== Xóa kiến trúc thừa và strip libadb.so ==="
          rm -rf app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64
          if [ -n "$STRIP_TOOL" ] && [ -f "app/src/main/jniLibs/arm64-v8a/libadb.so" ]; then
            "$STRIP_TOOL" --strip-all app/src/main/jniLibs/arm64-v8a/libadb.so || true
          fi

          # Vá lỗi kho lưu trữ cũ và thử biên dịch từ nguồn
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle || true
          chmod +x gradlew
          if ./gradlew assembleRelease -x lint --no-daemon; then
            UNSIGNED_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          # Chế độ bảo hiểm 100%: Nếu Gradle cũ lỗi, tự động lấy APK gốc về gọt sạch ABI thừa và strip
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "=== Chuyển sang tối ưu nhị phân trực tiếp ==="
            APK_URL=$(curl -s https://api.github.com/repos/zwc456baby/ScrcpyForAndroid/releases | grep -o 'https://github.com/zwc456baby/ScrcpyForAndroid/releases/download/[^"]*\.apk' | head -n 1)
            if [ -z "$APK_URL" ]; then
              APK_URL="https://github.com/zwc456baby/ScrcpyForAndroid/releases/download/v1.6.1/scrcpy-1.6.1-r36-release.apk"
            fi
            curl -fL -o base.apk "$APK_URL"
            zip -d base.apk "lib/armeabi-v7a/*" "lib/x86/*" "lib/x86_64/*" "META-INF/*" || true
            unzip -o base.apk "lib/arm64-v8a/*.so" || true
            if [ -n "$STRIP_TOOL" ] && [ -d "lib/arm64-v8a" ]; then
              "$STRIP_TOOL" --strip-all lib/arm64-v8a/*.so || true
            fi
            zip -u -9 base.apk lib/arm64-v8a/*.so || true
            UNSIGNED_APK="base.apk"
          fi

          echo "=== Zipalign và Ký chứng chỉ V1/V2/V3 ==="
          rm -f release.keystore aligned.apk ScrcpyForAndroid-arm64-UltraOpt.apk
          keytool -genkey -v -keystore release.keystore -alias scrcpy_opt \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=ScrcpyOpt, OU=Dev, O=Opt, L=VN, S=VN, C=VN"

          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -f -v -p 4 "$UNSIGNED_APK" aligned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ScrcpyForAndroid-arm64-UltraOpt.apk aligned.apk

      - name: 4. Xuất file vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyForAndroid-Ultra-Optimized-APK
          path: ScrcpyForAndroid-arm64-UltraOpt.apk

      - name: 5. Đăng thẳng file APK lên mục Releases của Repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1-ultra-opt
          name: "ScrcpyForAndroid Ultra-Optimized (arm64)"
          files: ScrcpyForAndroid-arm64-UltraOpt.apk
